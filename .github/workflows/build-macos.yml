name: Build OBSKUR for macOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: FreePascal Compiler via Homebrew installieren
        run: brew install fpc

      - name: Lazarus 4.4 herunterladen und LCL + lazbuild bauen
        run: |
          curl -L "https://gitlab.com/freepascal.org/lazarus/lazarus/-/archive/lazarus_4_4/lazarus-lazarus_4_4.tar.gz" -o lazarus.tar.gz
          mkdir -p ~/lazarus
          tar -xzf lazarus.tar.gz -C ~/lazarus --strip-components=1
          cd ~/lazarus
          make lazbuild lcl LCL_PLATFORM=cocoa

      - name: macOS App-Bundle kompilieren
        run: ~/lazarus/lazbuild --ws=cocoa obskur.lpi

      - name: Fertige obskur.app verpacken
        run: |
          mkdir -p dist
          APP_DIR=$(find . -name "obskur.app" -type d | head -n 1)
          BIN_FILE=$(find lib -name "obskur" -type f | head -n 1)
          if [ -n "$APP_DIR" ] && [ -n "$BIN_FILE" ]; then
            mkdir -p "$APP_DIR/Contents/MacOS"
            cp "$BIN_FILE" "$APP_DIR/Contents/MacOS/obskur"
            chmod +x "$APP_DIR/Contents/MacOS/obskur"
            cp -R "$APP_DIR" dist/
          fi

      - name: macOS App als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: OBSKUR-macOS-App
          path: dist/obskur.app
