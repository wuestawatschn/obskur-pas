name: Build OBSKUR for macOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: FreePascal & Lazarus via Homebrew installieren
        run: |
          brew update
          brew install --cask fpc-laz fpc-src-laz lazarus

      - name: macOS App-Bundle mit Cocoa kompilieren
        run: |
          lazbuild --ws=cocoa obskur.lpi

      - name: Fertige obskur.app verpacken
        run: |
          mkdir -p dist
          # Binary aus dem Output-Ordner in das .app-Bundle kopieren, falls nötig
          APP_DIR=$(find . -name "obskur.app" -type d | head -n 1)
          BIN_FILE=$(find lib -name "obskur" -type f | head -n 1)
          if [ -n "$APP_DIR" ] && [ -n "$BIN_FILE" ]; then
            mkdir -p "$APP_DIR/Contents/MacOS"
            cp "$BIN_FILE" "$APP_DIR/Contents/MacOS/obskur"
            chmod +x "$APP_DIR/Contents/MacOS/obskur"
            cp -R "$APP_DIR" dist/
          fi

      - name: macOS App als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: OBSKUR-macOS-App
          path: dist/obskur.app
