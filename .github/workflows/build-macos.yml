name: Build OBSKUR for Linux, macOS & Windows

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Lazarus & GTK2 installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y lazarus fpc libgtk2.0-dev

      - name: Linux Binary kompilieren
        run: |
          lazbuild --ws=gtk2 obskur.lpi
          mkdir -p dist
          cp lib/x86_64-linux/obskur dist/obskur-linux-x86_64
          chmod +x dist/obskur-linux-x86_64

      - name: Linux Binary als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: OBSKUR-Linux-x86_64
          path: dist/obskur-linux-x86_64

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: FreePascal Compiler via Homebrew installieren
        run: brew install fpc

      - name: Lazarus 4.4 herunterladen und LCL + lazbuild bauen
        run: |
          curl -L "https://gitlab.com/freepascal.org/lazarus/lazarus/-/archive/lazarus_4_4/lazarus-lazarus_4_4.tar.gz" -o lazarus.tar.gz
          mkdir -p ~/lazarus
          tar -xzf lazarus.tar.gz -C ~/lazarus --strip-components=1
          cd ~/lazarus
          make lazbuild lcl LCL_PLATFORM=cocoa

      - name: macOS App-Bundle kompilieren
        run: ~/lazarus/lazbuild --lazarusdir=$HOME/lazarus --ws=cocoa --opt="-k-ld_classic" obskur.lpi

      - name: Fertige obskur.app verpacken
        run: |
          mkdir -p dist
          cp -RL lib/aarch64-darwin/obskur.app dist/
          chmod +x dist/obskur.app/Contents/MacOS/obskur

      - name: macOS App als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: OBSKUR-macOS-App
          path: dist/obskur.app

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Lazarus 4.4 via setup-lazarus installieren
        uses: gcarreno/setup-lazarus@v3
        with:
          lazarus-version: "4.4"

      - name: Windows obskur.exe kompilieren
        shell: pwsh
        run: |
          lazbuild --ws=win32 obskur.lpi
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = Get-ChildItem -Path "lib" -Filter "obskur.exe" -Recurse | Select-Object -First 1
          Copy-Item $exe.FullName -Destination "dist\obskur.exe"

      - name: Windows EXE als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: OBSKUR-Windows-EXE
          path: dist/obskur.exe

  create-release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Alle Artifacts herunterladen
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Saubere ZIP-Archive packen
        run: |
          mkdir -p release_files
          zip -j release_files/OBSKUR-Linux-x86_64.zip artifacts/OBSKUR-Linux-x86_64/obskur-linux-x86_64
          zip -j release_files/OBSKUR-Windows-x64.zip artifacts/OBSKUR-Windows-EXE/obskur.exe
          mkdir -p mac_pkg/obskur.app && cp -R artifacts/OBSKUR-macOS-App/* mac_pkg/obskur.app/ && (cd mac_pkg && zip -r ../release_files/OBSKUR-macOS-AppleSilicon.zip obskur.app)

      - name: GitHub Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          name: "OBSKUR Studio ${{ github.ref_name }}"
          generate_release_notes: true
          files: release_files/*
